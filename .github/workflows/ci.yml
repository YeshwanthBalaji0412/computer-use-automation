name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The whole point of this workflow is that it needs no API key. Discovery replays a
# recorded transcript and replay never calls a model at all, so every gate below runs on a
# fork, on a clean clone, with no secrets configured.
env:
  PYTHONUNBUFFERED: "1"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Caching deliberately off. The action's *post* step - which saves the cache after
      # every gate has already passed - failed and took a fully green run red with it.
      # `uv sync` here is well under a minute, so the cache was buying seconds and
      # costing a false signal on the one thing a reviewer looks at before cloning.
      # The Playwright browser is ~150MB and genuinely worth caching; that is handled
      # below by actions/cache, which tolerates a key that already exists.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # Cached separately from the Python environment: the browser is ~150MB and changes
      # far less often than the lockfile.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Format and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Types
        run: uv run mypy

      # The contract that matters most: replay may not import `openai` or
      # `cua.discovery`. "Replay runs without invoking the LLM" is a requirement, and this
      # is where it is proved rather than asserted.
      - name: Architecture contracts
        run: uv run lint-imports

      - name: Unit tests
        run: uv run pytest -m unit -q

      # Drives a real Chromium against the local target app. Slower, and the only place
      # the locator ladder, the frame handling and the handoff are exercised for real.
      #
      # The matrix test is deselected here because the next step runs the same fourteen
      # scenarios through the CLI. Running both costs twelve minutes of browser time twice
      # over, against a forty-five minute budget.
      - name: Integration tests
        run: >
          uv run pytest -m "integration or eval" -q
          --deselect tests/integration/test_replay.py::test_the_scenario_matrix_passes

      # Fourteen scenarios, nine different answers, no API key. Run through the CLI rather
      # than pytest so the table itself lands in the workflow log, where a reviewer can
      # read it without cloning anything.
      #
      # Unlike the tests above - which start their own server on an ephemeral port - the
      # CLI reads the committed tenant profiles, and those point at localhost:4000. So the
      # target app has to be running, and this step is where that was missed.
      - name: Scenario matrix
        run: |
          uv run cua serve-app &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4000/tenants/meridian/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:4000/tenants/meridian/ >/dev/null || {
            echo "target app never came up"; exit 1;
          }
          uv run cua eval

      # Redaction is a promise about every egress, so it is checked rather than reviewed.
      - name: Redaction gate
        run: uv run python scripts/check_secrets.py
