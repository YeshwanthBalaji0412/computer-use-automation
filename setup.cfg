# Architecture contracts, enforced in CI by import-linter (`uv run lint-imports`).
#
# Contract 1 is the load-bearing one: requirement 3.3 says deterministic replay must run
# "without invoking the LLM for decisions". This makes that claim mechanically verifiable
# instead of a promise in a README. It is backed up by
# tests/integration/test_replay.py::test_replay_never_loads_the_llm_sdk, which runs a
# subprocess and asserts the module was never even loaded.

[importlinter]
root_package = cua
# Required because contracts 1 and 2 forbid third-party packages (openai, playwright),
# not just internal modules.
include_external_packages = True

[importlinter:contract:1]
name = Deterministic replay never touches the LLM
type = forbidden
source_modules =
    cua.replay
forbidden_modules =
    openai
    cua.discovery

[importlinter:contract:2]
name = Playwright is confined to the surface adapter
type = forbidden
source_modules =
    cua.schema
    cua.policy
    cua.discovery
    cua.replay
    cua.catalog
forbidden_modules =
    playwright

# `cua.app` is the composition layer and is deliberately absent from the list above: it
# is the one place allowed to construct concrete adapters. Everything it wires together
# is still bound by the contracts.

[importlinter:contract:3]
name = The schema layer depends on nothing else in the app
type = forbidden
source_modules =
    cua.schema
forbidden_modules =
    cua.surface
    cua.locator
    cua.discovery
    cua.replay
    cua.control
    cua.evidence
    cua.catalog
